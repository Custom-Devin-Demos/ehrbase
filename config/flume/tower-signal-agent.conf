# ============================================================================
# Flume Agent: Tower Signal Collector
# ============================================================================
# Collects tower signal measurements from syslog sources,
# validates/enriches via interceptors, and writes to Kafka.
# ============================================================================

agent.sources = syslog-tower-signals
agent.sinks = kafka-sink hdfs-backup-sink
agent.channels = kafka-channel hdfs-channel

# Source: syslog from tower management system
agent.sources.syslog-tower-signals.type = syslogtcp
agent.sources.syslog-tower-signals.host = 0.0.0.0
agent.sources.syslog-tower-signals.port = 5140
agent.sources.syslog-tower-signals.channels = kafka-channel hdfs-channel
agent.sources.syslog-tower-signals.selector.type = replicating

# Interceptors for validation and enrichment
agent.sources.syslog-tower-signals.interceptors = i1 i2 i3
agent.sources.syslog-tower-signals.interceptors.i1.type = com.telco.pipeline.ingestion.flume.TowerSignalInterceptor$Builder
agent.sources.syslog-tower-signals.interceptors.i2.type = timestamp
agent.sources.syslog-tower-signals.interceptors.i3.type = host
agent.sources.syslog-tower-signals.interceptors.i3.hostHeader = collector_host

# Primary sink: Kafka
agent.sinks.kafka-sink.type = org.apache.flume.sink.kafka.KafkaSink
agent.sinks.kafka-sink.kafka.topic = telco.raw.tower-signals
agent.sinks.kafka-sink.kafka.bootstrap.servers = kafka-broker-0:9092,kafka-broker-1:9092,kafka-broker-2:9092
agent.sinks.kafka-sink.kafka.producer.acks = all
agent.sinks.kafka-sink.kafka.producer.compression.type = lz4
agent.sinks.kafka-sink.kafka.producer.linger.ms = 5
agent.sinks.kafka-sink.kafka.producer.batch.size = 65536
agent.sinks.kafka-sink.flumeBatchSize = 500
agent.sinks.kafka-sink.channel = kafka-channel

# Backup sink: HDFS (disaster recovery)
agent.sinks.hdfs-backup-sink.type = hdfs
agent.sinks.hdfs-backup-sink.hdfs.path = /data/backup/tower-signals/dt=%Y-%m-%d/hr=%H
agent.sinks.hdfs-backup-sink.hdfs.filePrefix = signals
agent.sinks.hdfs-backup-sink.hdfs.fileSuffix = .avro
agent.sinks.hdfs-backup-sink.hdfs.rollInterval = 300
agent.sinks.hdfs-backup-sink.hdfs.rollSize = 134217728
agent.sinks.hdfs-backup-sink.hdfs.rollCount = 0
agent.sinks.hdfs-backup-sink.hdfs.batchSize = 1000
agent.sinks.hdfs-backup-sink.hdfs.fileType = DataStream
agent.sinks.hdfs-backup-sink.hdfs.codeC = snappy
agent.sinks.hdfs-backup-sink.channel = hdfs-channel

# Channels
agent.channels.kafka-channel.type = memory
agent.channels.kafka-channel.capacity = 100000
agent.channels.kafka-channel.transactionCapacity = 5000

agent.channels.hdfs-channel.type = file
agent.channels.hdfs-channel.checkpointDir = /data/flume/checkpoint/signals
agent.channels.hdfs-channel.dataDirs = /data/flume/data/signals
agent.channels.hdfs-channel.capacity = 10000000
agent.channels.hdfs-channel.transactionCapacity = 10000

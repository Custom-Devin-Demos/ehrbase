version: '3.8'

# ============================================================================
# Telco Data Pipeline: Local Development Environment
# ============================================================================
# Provides a complete Hadoop ecosystem for local development and testing.
# NOT for production use.
# ============================================================================

services:
  # ZooKeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    hostname: zookeeper
    container_name: telco-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-logs:/var/lib/zookeeper/log

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    hostname: kafka
    container_name: telco-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Hadoop NameNode
  namenode:
    image: apache/hadoop:3.3.6
    hostname: namenode
    container_name: telco-namenode
    user: root
    command: ["bash", "-c", "mkdir -p /tmp/hadoop-root/dfs/name && if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then hdfs namenode -format -force; fi && hdfs namenode"]
    ports:
      - "9870:9870"
      - "8020:8020"
    environment:
      HADOOP_HOME: /opt/hadoop
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    env_file:
      - ./hadoop.env
    volumes:
      - namenode-data:/tmp/hadoop-root/dfs/name

  # Hadoop DataNode
  datanode:
    image: apache/hadoop:3.3.6
    hostname: datanode
    container_name: telco-datanode
    user: root
    command: ["bash", "-c", "mkdir -p /tmp/hadoop-root/dfs/data && sleep 15 && hdfs datanode"]
    depends_on:
      - namenode
    environment:
      HADOOP_HOME: /opt/hadoop
    env_file:
      - ./hadoop.env
    volumes:
      - datanode-data:/tmp/hadoop-root/dfs/data

  # YARN ResourceManager
  resourcemanager:
    image: apache/hadoop:3.3.6
    hostname: resourcemanager
    container_name: telco-resourcemanager
    user: root
    command: ["yarn", "resourcemanager"]
    depends_on:
      - namenode
    ports:
      - "8088:8088"
    env_file:
      - ./hadoop.env

  # YARN NodeManager
  nodemanager:
    image: apache/hadoop:3.3.6
    hostname: nodemanager
    container_name: telco-nodemanager
    user: root
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    env_file:
      - ./hadoop.env

  # HBase Master
  hbase-master:
    image: harisekhon/hbase:latest
    hostname: hbase-master
    container_name: telco-hbase-master
    depends_on:
      - zookeeper
      - namenode
    ports:
      - "16010:16010"
      - "16000:16000"
    environment:
      HBASE_MANAGES_ZK: "false"
    volumes:
      - ../config/hbase/hbase-site.xml:/opt/hbase/conf/hbase-site.xml:ro

  # Hive Metastore Database (PostgreSQL)
  hive-metastore-db:
    image: postgres:15-alpine
    hostname: hive-metastore-db
    container_name: telco-hive-metastore-db
    environment:
      POSTGRES_DB: hive_metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_dev_password
    volumes:
      - hive-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # Hive Server
  hive-server:
    image: apache/hive:3.1.3
    hostname: hive-server
    container_name: telco-hive-server
    depends_on:
      - hive-metastore-db
      - namenode
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-db:5432/hive_metastore"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: "org.postgresql.Driver"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: "hive"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: "hive_dev_password"
      HIVE_SITE_CONF_hive_execution_engine: "mr"
      HIVE_SITE_CONF_hive_metastore_warehouse_dir: "/data/warehouse"

volumes:
  zk-data:
  zk-logs:
  kafka-data:
  namenode-data:
  datanode-data:
  hive-db-data:

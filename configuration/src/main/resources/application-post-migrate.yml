# Post-migration profile: Use VALIDATE mode to verify migration checksums
# without re-running migrations.
#
# IMPORTANT: This profile must always be combined with another profile that
# provides datasource configuration (local, docker, or cloud). Using
# post-migrate alone will fail because no datasource URL is configured in the
# base application.yml.
#
# Examples:
#   --spring.profiles.active=local,post-migrate
#   --spring.profiles.active=docker,post-migrate
#   --spring.profiles.active=cloud,post-migrate
#
# Alternatively, use spring.profiles.include in your environment-specific
# profile or set the flyway strategy properties directly:
#   SPRING_FLYWAY_EHR_STRATEGY=VALIDATE
#   SPRING_FLYWAY_EXT_STRATEGY=VALIDATE
spring:
  flyway:
    ehr-strategy: VALIDATE
    ext-strategy: VALIDATE

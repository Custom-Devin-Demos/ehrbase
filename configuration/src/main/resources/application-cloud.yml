spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ehrbase
    username: ${DB_USER:ehrbase_restricted}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 50
      max-lifetime: 1800000
      minimum-idle: 10
  flyway:
    schemas: ehr
    user: ${DB_USER_ADMIN:ehrbase}
    password: ${DB_PASS_ADMIN}

security:
  authType: NONE
  authPassword: not-set
  authAdminPassword: not-set


